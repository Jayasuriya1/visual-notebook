<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Warm Paper Texture / Gradient -->
    <linearGradient id="warmPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F7EEDD"/>
    </linearGradient>

    <!-- Brain / Neural Focus Glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Stroke / Border for Crisp Title Bar & Dock Contrast -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#F59E0B" stroke-width="6" stroke-opacity="0.6"/>

  <g filter="url(#softShadow)">
    <!-- Open Book Base Layer (Shadow / Binding) -->
    <path d="M76 380 C 130 350, 220 350, 256 376 C 292 350, 382 350, 436 380 L 440 180 C 386 150, 296 150, 256 176 C 216 150, 126 150, 72 180 Z" fill="#111827" stroke="#111827" stroke-width="12" stroke-linejoin="round"/>

    <!-- Left Book Page Stack (Warm Paper) -->
    <path d="M 80 176 C 136 148, 224 148, 256 174 L 256 368 C 224 342, 136 342, 80 370 Z" fill="url(#warmPaperGrad)" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <!-- Right Book Page Stack (Warm Paper) -->
    <path d="M 256 174 C 288 148, 376 148, 432 176 L 432 370 C 376 342, 288 342, 256 368 Z" fill="url(#warmPaperGrad)" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>

    <!-- Spine Center Shadow -->
    <path d="M 254 174 L 258 174 L 258 368 L 254 368 Z" fill="#94A3B8" opacity="0.4"/>

    <!-- Left Page Flowchart / Textbook Diagram Lines -->
    <line x1="110" y1="210" x2="226" y2="210" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <line x1="110" y1="236" x2="200" y2="236" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="262" x2="226" y2="262" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <!-- Node box on left page -->
    <rect x="110" y="290" width="46" height="24" rx="5" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="3"/>
    <line x1="156" y1="302" x2="182" y2="302" stroke="#1D4ED8" stroke-width="3"/>
    <rect x="182" y="290" width="44" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <!-- Right Page ADHD Visual Anchor Lines -->
    <line x1="286" y1="210" x2="402" y2="210" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <line x1="286" y1="236" x2="380" y2="236" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="286" y1="262" x2="402" y2="262" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <!-- Anchor box on right page -->
    <rect x="286" y="290" width="116" height="24" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>

    <!-- Bookmark Ribbon Hanging From Spine -->
    <path d="M 246 174 L 246 394 L 256 384 L 266 394 L 266 174 Z" fill="#DC2626" stroke="#111827" stroke-width="4"/>
  </g>

  <!-- Neuro-Focus & Dopamine Spark Rising From the Book -->
  <g filter="url(#softShadow)">
    <!-- Central Brain Hemisphere Left -->
    <path d="M 252 144 C 238 144, 218 136, 212 120 C 206 104, 216 94, 222 84 C 214 74, 222 56, 236 56 C 248 56, 252 66, 252 74 Z" fill="url(#blueAccent)" stroke="#111827" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Central Brain Hemisphere Right -->
    <path d="M 260 144 C 274 144, 294 136, 300 120 C 306 104, 296 94, 290 84 C 298 74, 290 56, 276 56 C 264 56, 260 66, 260 74 Z" fill="url(#amberGlow)" stroke="#111827" stroke-width="6" stroke-linejoin="round"/>

    <!-- Synaptic Focus Spark in Center -->
    <path d="M 256 50 L 263 72 L 285 79 L 263 86 L 256 108 L 249 86 L 227 79 L 249 72 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/>

    <!-- Sparkle Accents -->
    <circle cx="190" cy="88" r="6" fill="#F59E0B"/>
    <circle cx="322" cy="88" r="6" fill="#60A5FA"/>
    <circle cx="256" cy="36" r="5" fill="#FFFFFF"/>
  </g>

  <!-- YouTube Play Accent / Badge in Bottom Right -->
  <g filter="url(#softShadow)">
    <rect x="330" y="360" width="112" height="78" rx="22" fill="#DC2626" stroke="#111827" stroke-width="6"/>
    <!-- Play Triangle -->
    <polygon points="374,382 374,416 404,399" fill="#FFFFFF"/>
  </g>
</svg>
